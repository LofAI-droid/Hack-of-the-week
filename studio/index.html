<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Virtuele studio — GenAI Kennishub (Blender)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/Montserrat-latin-var.woff2") format("woff2");
        font-weight: 100 900;
      }
      :root {
        --navy: #003a7d; --blue: #0152af; --magenta: #e4004f; --yellow: #fdb028;
        --sky: #86caf6; --surface: #ffffff; --surface-tint: #eaf4fd; --ink-muted: #4a6283;
        --font-sans: Montserrat, "Helvetica Neue", Arial, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #dfe5ec; font-family: var(--font-sans); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

      .laag { position: absolute; inset: 0; }
      .laag img { width: 1920px; height: 1080px; display: block; }

      /* Panelen: posities komen uit Blender (studio_scene.py drukt ze af) */
      .paneel-wrap { position: absolute; top: 259px; width: 252px; height: 359px; }
      .paneel {
        position: absolute; inset: 0; border-radius: 6px; overflow: hidden;
        background: linear-gradient(100deg, #f3f6f9 0%, #fbfcfd 55%, #ffffff 100%);
        box-shadow: 0 1px 0 rgba(255,255,255,0.9) inset, -3px 0 0 rgba(0,40,90,0.06) inset, 0 10px 30px -12px rgba(0,40,90,0.25);
        color: var(--navy); padding: 26px 22px; display: flex; flex-direction: column;
      }
      .paneel .balk { position: absolute; left: 0; top: 0; right: 0; height: 7px; background: var(--navy); }
      .paneel .icoon { width: 76px; height: 76px; margin-top: 12px; }
      .paneel .label { margin-top: auto; font-size: 18px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); line-height: 1.3; }
      .paneel .titel { margin-top: 8px; font-size: 32px; line-height: 1.12; font-weight: 700; }
      .paneel .streep { margin-top: 14px; width: 52px; height: 5px; background: var(--magenta); transform-origin: left center; }
      .gloed {
        position: absolute; inset: -2px; border-radius: 8px; pointer-events: none; opacity: 0;
        box-shadow: 0 0 0 3px var(--magenta), 0 20px 60px -8px rgba(228, 0, 79, 0.35);
      }
      /* Spiegeling in de gepolijste vloer */
      .spiegel {
        position: absolute; top: 942px; width: 252px; height: 359px; transform: scaleY(-1);
        opacity: 0.16; filter: blur(2px);
        -webkit-mask-image: linear-gradient(0deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 45%);
                mask-image: linear-gradient(0deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 45%);
      }
      .spiegel .paneel { box-shadow: none; }

      /* Presentator: tijdelijk silhouet */
      #presentator { position: absolute; left: 230px; bottom: 0; width: 560px; height: 830px; }
      #presentator svg { width: 100%; height: 100%; }
      .plaatshouder { position: absolute; left: 230px; bottom: 40px; width: 560px; text-align: center; font-size: 28px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--surface); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1920" data-height="1080">

      <!-- Ruimte uit Blender: zonder en met de schaduwen van de panelen -->
      <div class="laag clip" id="bg-leeg" data-start="0" data-duration="16" data-track-index="0" data-hold>
        <img src="assets/studio/studio-achtergrond.png" alt="" />
      </div>
      <div class="laag clip" id="bg-schaduw" data-start="0" data-duration="16" data-track-index="1">
        <img src="assets/studio/studio-achtergrond-panelen.png" alt="" />
      </div>

      <!-- Spiegelingen -->
      <div class="laag clip" id="spiegels" data-start="0" data-duration="16" data-track-index="2">
        <div class="spiegel" id="sp1" style="left:978px;"><div class="paneel"><div class="balk"></div></div></div>
        <div class="spiegel" id="sp2" style="left:1265px;"><div class="paneel"><div class="balk" id="sp2-balk"></div></div></div>
        <div class="spiegel" id="sp3" style="left:1553px;"><div class="paneel"><div class="balk"></div></div></div>
      </div>

      <!-- Panelen -->
      <div class="laag clip" id="panelen" data-start="0" data-duration="16" data-track-index="3">
        <div class="paneel-wrap" id="p1" style="left:978px;">
          <div class="paneel">
            <div class="balk"></div>
            <svg class="icoon" viewBox="0 0 96 96" aria-hidden="true">
              <circle cx="48" cy="48" r="44" fill="#eaf4fd" stroke="#003a7d" stroke-width="4" />
              <path d="M40 32 L66 48 L40 64 Z" fill="#003a7d" />
            </svg>
            <div class="label" data-layout-ignore>Van vraag naar inzicht</div>
            <div class="titel">Kennisclips</div>
            <div class="streep"></div>
          </div>
          <div class="gloed"></div>
        </div>
        <div class="paneel-wrap" id="p2" style="left:1265px;">
          <div class="paneel">
            <div class="balk" id="p2-balk"></div>
            <svg class="icoon" viewBox="0 0 96 96" aria-hidden="true">
              <circle cx="48" cy="48" r="44" fill="#fdb028" />
              <path d="M53 20 L33 52 L47 52 L42 76 L64 42 L50 42 Z" fill="#003a7d" />
            </svg>
            <div class="label" data-layout-ignore>Van probleem naar oplossing</div>
            <div class="titel">Hack of the Week</div>
            <div class="streep"></div>
          </div>
          <div class="gloed" id="gloed2"></div>
        </div>
        <div class="paneel-wrap" id="p3" style="left:1553px;">
          <div class="paneel">
            <div class="balk"></div>
            <svg class="icoon" viewBox="0 0 96 96" aria-hidden="true">
              <circle cx="48" cy="48" r="44" fill="#eaf4fd" stroke="#003a7d" stroke-width="4" />
              <g stroke="#003a7d" stroke-width="3" stroke-dasharray="4 4"><line x1="28" y1="34" x2="52" y2="26" /><line x1="52" y1="26" x2="68" y2="50" /><line x1="68" y1="50" x2="44" y2="68" /><line x1="44" y1="68" x2="28" y2="34" /><line x1="52" y1="26" x2="44" y2="68" /></g>
              <circle cx="28" cy="34" r="6" fill="#003a7d" /><circle cx="52" cy="26" r="6" fill="#e4004f" /><circle cx="68" cy="50" r="6" fill="#003a7d" /><circle cx="44" cy="68" r="6" fill="#0152af" />
            </svg>
            <div class="label" data-layout-ignore>Wat kan wat</div>
            <div class="titel">AI-tools</div>
            <div class="streep"></div>
          </div>
          <div class="gloed"></div>
        </div>
      </div>

      <!-- Presentator: tijdelijk silhouet, later jouw opname zonder achtergrond -->
      <div id="presentator" class="clip" data-start="0" data-duration="16" data-track-index="4" data-hold>
        <svg viewBox="0 0 560 830" aria-hidden="true">
          <defs>
            <linearGradient id="silh" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4b6584" /><stop offset="1" stop-color="#2c4563" />
            </linearGradient>
          </defs>
          <ellipse cx="280" cy="170" rx="92" ry="112" fill="url(#silh)" />
          <rect x="238" y="262" width="84" height="80" rx="30" fill="url(#silh)" />
          <path d="M60 830 C60 560 90 400 180 352 C220 332 250 326 280 326 C310 326 340 332 380 352 C470 400 500 560 500 830 Z" fill="url(#silh)" />
        </svg>
      </div>
      <div class="plaatshouder clip" data-start="0" data-duration="16" data-track-index="5">Jouw opname</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Schaduwen van de panelen verschijnen samen met de panelen
      tl.fromTo("#bg-schaduw", { opacity: 0 }, { opacity: 1, duration: 2.4, ease: "power1.inOut" }, 1.6);

      // 1.6–3.8 s: panelen verschijnen één voor één
      [1, 2, 3].forEach((n, i) => {
        const t = 1.6 + i * 0.7;
        tl.fromTo("#p" + n, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 1.1, ease: "power3.out" }, t);
        tl.fromTo("#sp" + n, { opacity: 0, y: -40 }, { opacity: 0.16, y: 0, duration: 1.1, ease: "power3.out" }, t);
        tl.fromTo("#p" + n + " .streep", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, t + 0.6);
      });

      // Zachte zweefbeweging; de spiegeling beweegt in tegengestelde richting
      [1, 2, 3].forEach((n, i) => {
        const start = 2.8 + i * 0.7;
        const periode = 3.2 + i * 0.4;
        for (let t = start; t < 16; t += periode) {
          const a = Math.min(periode / 2, 16 - t);
          tl.to("#p" + n, { y: -10, duration: a, ease: "sine.inOut" }, t);
          tl.to("#sp" + n, { y: 10, duration: a, ease: "sine.inOut" }, t);
          if (t + a < 16) {
            const b = Math.min(periode / 2, 16 - t - a);
            tl.to("#p" + n, { y: 0, duration: b, ease: "sine.inOut" }, t + a);
            tl.to("#sp" + n, { y: 0, duration: b, ease: "sine.inOut" }, t + a);
          }
        }
      });

      // 7–11.5 s: Hack of the Week licht op, de andere twee treden terug
      tl.to("#p2", { scale: 1.06, duration: 0.9, ease: "power3.out" }, 7);
      tl.to("#gloed2", { opacity: 1, duration: 0.7, ease: "power2.out" }, 7.1);
      tl.to(["#p2-balk", "#sp2-balk"], { backgroundColor: "#e4004f", duration: 0.6 }, 7.1);
      tl.fromTo(["#p1 .paneel", "#p3 .paneel"], { filter: "grayscale(0) brightness(1) blur(0px)" }, { filter: "grayscale(0.7) brightness(0.9) blur(1.5px)", duration: 0.8, ease: "power2.out" }, 7);
      tl.to(["#sp1", "#sp3"], { opacity: 0.08, duration: 0.8, overwrite: "auto" }, 7);

      tl.to("#p2", { scale: 1, duration: 0.9, ease: "power2.inOut" }, 11.5);
      tl.to("#gloed2", { opacity: 0, duration: 0.6 }, 11.5);
      tl.to(["#p2-balk", "#sp2-balk"], { backgroundColor: "#003a7d", duration: 0.6 }, 11.5);
      tl.to(["#p1 .paneel", "#p3 .paneel"], { filter: "grayscale(0) brightness(1) blur(0px)", duration: 0.8, ease: "power2.inOut" }, 11.5);
      tl.to(["#sp1", "#sp3"], { opacity: 0.16, duration: 0.8, overwrite: "auto" }, 11.5);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
